<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>akashiq</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="page">
    <header class="header">
      <h1><span id="project"></span> <span class="muted">decisions</span></h1>
      <span id="live" class="live" title="Reloads when decision or test files change">connecting…</span>
    </header>

    <dl id="summary" class="summary"></dl>

    <div class="filters">
      <input id="query" type="search" placeholder="Search IDs, decisions, reasons, values" aria-label="Search">
      <select id="tested" aria-label="Tests">
        <option value="all">All tests</option>
        <option value="guarded">Guarded</option>
        <option value="unguarded">Not guarded</option>
      </select>
      <select id="confirm" aria-label="Confirmation">
        <option value="all">All decisions</option>
        <option value="unconfirmed">Unconfirmed only</option>
      </select>
      <span id="count" class="count"></span>
      <button id="expand" type="button" class="text-button">Expand all</button>
      <button id="collapse" type="button" class="text-button">Collapse all</button>
    </div>

    <pre id="error" class="error" hidden></pre>
    <section id="unknown" class="warning" hidden>
      <h2>guards with no matching decision</h2>
      <ul id="unknown-list"></ul>
    </section>
    <div id="files"><p class="empty">Loading…</p></div>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
